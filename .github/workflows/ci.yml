# ─────────────────────────────────────────────────────────────
# Suvex CI
#
# 三件事，各自独立（任一失败不影响其余跑完，便于一次看全问题）：
#
#   1. backend    —— 静态检查（ruff）+ 1134 个测试函数，对**真实 PostgreSQL** 跑
#   2. frontend   —— 类型检查 + lint + 三个契约校验脚本
#   3. hygiene    —— 仓库卫生：凭据/产物未入库、行尾统一为 LF
#
# ★ 为什么第 3 条也值得一个 job
#
# 这个仓库刚因为 CRLF 入库吃过一次亏（54 个文件 + 2 个 mixed）。
# 那类问题**不会**让任何测试变红，只会在交付到 Linux 时以
# `bad interpreter: /bin/sh^M` 的形式爆出来 —— 而那时错误信息
# 指向解释器路径，排查方向会跑偏。所以把它做成 CI 里的一条硬检查。
#
# ─────────────────────────────────────────────────────────────
# ★ 为什么钉 `ubuntu-24.04` 而不是用 `ubuntu-latest`
#
# 2026-10-11 首次全绿时，三个 job 各报了一条 notice：
#   「The ubuntu-latest label will migrate to Ubuntu 26
#     beginning October 19, 2026.」
#
# 那是**自动发生**的镜像切换。而这一整轮 CI 排障的教训就是：
# 最难查的红是「我什么都没改，它却红了」—— 前 6 次全红里有好几次
# 都属于这一类（开发机的 `:55432` 真在跑、`alembic` 读错变量等）。
# 自动迁移会再造一个同类型的坑，只不过日子是 10-19。
#
# 钉住是**零行为变化**的：迁移开始之前，`ubuntu-latest` 就等于
# `ubuntu-24.04`。所以这一行不改变今天的任何东西，它只是把
# 「8 天后自动变」换成「一次显式、可验证的升级」。
#
# ## 升到 26.04 时要看什么（已提前查过，影响面很小）
#
# 三个依赖都不随镜像走，所以基本不受影响：
#   · Python —— `setup-python@v6` 装 3.12，与镜像自带的 3.14 无关；
#   · Node   —— `setup-node@v5` 装 22，与镜像自带的 24 无关；
#   · PostgreSQL —— 用 **service container**（`postgres:16-alpine`），
#     与镜像自带的 18.6 无关。
#
# 唯一的实质依赖是 `psql` / `createdb`（"建测试库并跑迁移"那一步
# 用它们），这两个来自镜像。所以升级时要确认的**第一件事**是
# 它们在 26.04 镜像里仍然存在、且行为一致。
#
# ⚠️ 另外要留意的不是"组件版本"而是**系统库**（glibc / OpenSSL /
#    locale）—— 它们会影响 wheel 是否有预编译包。这类变化不会在
#    文档里列出来，只能靠真跑一次发现。
#
# 解除方式：把三处 `ubuntu-24.04` 改成 `ubuntu-26.04`，推一次，
# 看是否仍全绿。**不要**改回 `ubuntu-latest` —— 那等于把控制权
# 又交回给自动迁移。
# ─────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 允许手动触发（排查时不必空推一个提交）
  workflow_dispatch:

# 同一分支的新推送取消上一次未跑完的 —— 排队等旧结果没有意义
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════
  # 后端：静态检查（ruff）+ 1134 个测试函数
  # ═══════════════════════════════════════════════════════════
  backend:
    name: 后端测试（Python 3.12 + PostgreSQL 16）
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: suvex
          POSTGRES_PASSWORD: suvex_ci_password
          POSTGRES_DB: suvex
        ports:
          - 5432:5432
        # ★ 必须等 healthy，不能只等"容器起来了"。
        #   postgres 镜像在 initdb 期间就会监听端口，此时连接会被拒。
        #   只等 started 的后果是测试偶发失败，而且看起来像代码问题。
        options: >-
          --health-cmd "pg_isready -U suvex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # ★ 两个都要设，而且**都要指向 CI 的 postgres**。
      #
      # ## 这是 CI 全部 6 次失败的原因（2026-10-10 修）
      #
      # 第一版只设了 `SUPEX_TEST_DATABASE_URL`，然后跑了一步
      # `alembic upgrade head` —— 而 **alembic 读的是
      # `SUPEX_DATABASE_URL`**（见 `alembic/env.py` 的说明：
      # URL 从 `Settings` 读，不从 `alembic.ini` 读）。
      #
      # 于是那一步拿的是 `config.py` 的**开发机默认值**：
      #
      #     postgresql+psycopg://suvex:suvex_dev_local@127.0.0.1:55432/suvex
      #
      # 而 GitHub runner 上 `:55432` 什么都没有 —— 连接被拒，job 红。
      #
      # ## 为什么本地看不出来
      #
      # 开发机上那个 `:55432` 是**真的在跑**的（便携版 PostgreSQL
      # 服务），所以同一条命令本地成功、CI 失败。这类"本地全绿、
      # CI 全红"的差异最难怀疑到环境变量上 —— 而它其实是
      # **同一份配置在两台机器上指向不同东西**。
      #
      # ## 那一步其实是多余的
      #
      # `tests/conftest.py` 的 `_prepare_database` 会**自己建库并跑迁移**
      # （`_ensure_database` + `_upgrade_to_head`）。所以 pytest 一开始
      # 就会把库准备好。
      #
      # 但我**保留**那一步：它能在跑测试之前就暴露出"迁移链断了"
      # 这类问题，而那种失败的报错比"某个测试莫名其妙挂了"清楚得多。
      # 前提是它的 URL 正确 —— 见下面。
      SUPEX_DATABASE_URL: postgresql+psycopg://suvex:suvex_ci_password@127.0.0.1:5432/suvex_test
      # conftest.py 读它，且**自己会建库**（见 `_ensure_database`）。
      # 所以这里只指到 suvex_test 即可，不用预先建。
      SUPEX_TEST_DATABASE_URL: postgresql+psycopg://suvex:suvex_ci_password@127.0.0.1:5432/suvex_test
      # 生产环境变量在测试里必须是开发态，否则启动自检会拒绝启动
      SUPEX_ENV: dev
      SUPEX_COOKIE_SECURE: "false"

    defaults:
      run:
        working-directory: suvex-api

    steps:
      # ── action 运行时统一到 node24 ──────────────────────────────
      #
      # 第 7 次 CI（2026-10-10）的 Annotations 报了 2 条 warning：
      # 这些 action 声明的是 `runs.using: node20`，而 runner 已经把它们
      # **强制**跑在 Node 24 上。warning 不拦构建 —— 但 Node 20 退役后
      # 它就是硬失败，而且会在"本来好好的"某次推送里突然变红，
      # 那种红最难跟当次改动对上号。
      #
      # 版本号不是猜的：逐个读各 action 的 `action.yml` 拿 `runs.using`：
      #   checkout@v4 = node20   →  @v5 = node24
      #   setup-python@v5 = node20 →  @v6 = node24
      #   setup-node@v4 = node20 →  @v5 = node24
      # 三个**现用**版本全是 node20，三个**新版**全是 node24，
      # 所以三个一起往上跳一个 major。
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          # ★ 缓存键要覆盖**锁文件**（2026-10-11 改）。
          #
          # 原先只列了 `requirements-dev.txt`，而那个文件现在是
          # `-r requirements-dev.lock` —— 真正的版本在锁文件里。
          # 只按 .txt 算缓存键的后果：升级了依赖、锁文件变了，
          # 而 CI 仍然命中旧缓存，装的是**上一套**版本 ——
          # 于是"本地装新的能过、CI 用旧的却红"，方向完全反了。
          #
          # 四个文件都列上：两个锁文件（真正决定装什么）+ 两个
          # 声明文件（改了范围但还没重新生成锁文件时也能让缓存失效）。
          cache-dependency-path: |
            suvex-api/requirements.txt
            suvex-api/requirements.lock
            suvex-api/requirements-dev.txt
            suvex-api/requirements-dev.lock

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 静态检查（ruff）
        # ★ 这一步是 2026-10-13 补的 —— 在此之前后端**零静态检查**。
        #
        # ## 为什么需要它
        #
        # `suvex-api/pyproject.toml` 的 `[tool.ruff]` 配了很久
        # （`select = ["E","F","I","UP","B","SIM"]`），但 ruff **从未进入
        # 任何依赖声明**，CI 里也没有任何一步跑它 —— 于是那份配置是
        # 一份"声明"，不是一条"检查"，永远不会红。42,998 行 Python
        # 实际上没有 lint 兜底：一个未使用的 import、一个 `is` 误写成
        # `==`、一个重复的 dict 键，CI 全绿。
        #
        # 这正是本项目最警惕的那类东西：**看起来有防线、实际没有**。
        #
        # ## 为什么在这里 `pip install ruff`，而不是放进 requirements-dev
        #
        # 理想做法是让 ruff 走项目自己的锁文件（与其它依赖同一套纪律），
        # 而锁文件里**没有** ruff —— 所以要加它就得重新生成锁文件，
        # 那是一次会波及一批依赖版本的独立改动，不该和"接一个 lint"混在一起。
        # 所以这里按最小改动手工钉版本。
        #
        # ⚠️ **更正（2026-10-14 晚）**：这段注释原写的是
        #    「`requirements.lock` 钉着 `greenlet==3.5.6`，而那个版本
        #    已从 PyPI 下架，`pip-compile` 会报 No matching distribution」——
        #    **那个根因是错的**。实测：greenlet 3.5.6 在 PyPI 上存在且是
        #    最新版，锁里 79 个 hash 与 PyPI 79 个文件**全部匹配**，
        #    在 Linux 上 `pip install --require-hashes -r requirements.lock`
        #    **完全通过**（Would install … greenlet-3.5.6 … uvloop-0.23.0）。
        #
        #    真实情况是：锁文件**没问题**，只是 `uvloop` 没有平台标记
        #    （`; sys_platform != "win32"`），所以它在 **Windows 上**装不了。
        #    而 CI 与镜像构建都在 Linux —— 两条真实路径都不受影响。
        #
        #    留这段更正而不是删掉，是因为**"根因写错"比"没写"更危险**：
        #    后来者会照着"greenlet 下架"去重新生成锁文件，做一次
        #    没必要的大范围升级。
        #
        # ⚠️ **版本钉死**，与项目"依赖要有上界"的纪律一致：ruff 的规则会随
        #    版本增删，不钉的话"某次装到新版"会变成一次无预告的红。
        #    升版本时改这一行，并跑一次 `ruff check .` 确认仍全绿。
        #    （0.16.8 是当前开发机上验证过 `All checks passed` 的版本。）
        run: |
          pip install ruff==0.16.8
          ruff check .

      - name: 建测试库并跑迁移
        # ## 为什么要显式建库（2026-10-10 修 CI 时补）
        #
        # `tests/conftest.py` 的 `_prepare_database` 会自己建库 + 迁移，
        # 所以 pytest 一开始就能跑。而这一步是**提前**做同一件事 ——
        # 目的是让"迁移链断了"这类问题在这里就暴露，
        # 那种报错比"某个测试莫名其妙挂了"清楚得多。
        #
        # ⚠️ 但它必须**先建库**：这个 job 的 postgres service 只创建了
        #    `suvex` 那个库（`POSTGRES_DB`），而迁移的目标是 `suvex_test`。
        #    少了这一步会报 `database "suvex_test" does not exist` ——
        #    而那条错误看起来像"迁移写错了"，其实只是库还没建。
        #
        # ⚠️ 用 psql 而不是 `createdb`：GitHub 的 postgres service
        #    容器里两者都有，但 psql 的报错更清楚，而且能在同一条命令里
        #    做"存在就跳过"（`createdb` 遇到已存在会报错退出）。
        run: |
          PGPASSWORD=suvex_ci_password psql -h 127.0.0.1 -U suvex -d suvex \
            -tc "SELECT 1 FROM pg_database WHERE datname = 'suvex_test'" \
            | grep -q 1 || PGPASSWORD=suvex_ci_password createdb -h 127.0.0.1 -U suvex suvex_test
          alembic upgrade head

      - name: 跑测试
        # ★ 绝对不加 `-n auto` / pytest-xdist。
        #
        # 所有测试进程共用同一个 `suvex_test` 库，而每个用例开头会
        # TRUNCATE 一遍。并发跑会让它们互相清掉对方的数据 ——
        # 症状是随机的、看起来毫不相关的失败，而且**本地复现不出来**
        # （本地是串行跑的）。这类失败比"测试慢 10 分钟"贵得多。
        run: pytest -q

  # ═══════════════════════════════════════════════════════════
  # 前端：类型 + lint + 契约校验
  # ═══════════════════════════════════════════════════════════
  frontend:
    name: 前端检查（Node 22）
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: suvex-web

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: suvex-web/package-lock.json

      # `npm ci` 而不是 `npm install`：前者严格按 lock 文件装，
      # 后者会顺手更新 lock —— 那会让 CI 通过而本地锁定的版本其实不同。
      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        # ★ 与 typecheck/lint 是**互补**的，不是重复：
        #   那两个验不了运行时行为。2026-10-10 实测的两个缺陷
        #   （题解正文被截断、SSE 响应头被代理攒住 22 秒）都是
        #   typecheck + lint 全绿的情况下存在的。
        #   而 useActivityStream 里那个"批次内重复漏网"更是只有
        #   跑起来才看得见。
        run: npm run test

      - name: Lint
        run: npm run lint

      # 这三个脚本把"文档与实现一致"变成可复跑的命令。
      # 契约改了但类型没跟、或端点没覆盖，这里会红。
      - name: 契约与报告一致性校验
        run: npm run verify:all

      - name: 生产构建
        # 类型检查过了不代表构建能过（Vite 插件、资源引用等）。
        run: npm run build

  # ═══════════════════════════════════════════════════════════
  # 仓库卫生
  # ═══════════════════════════════════════════════════════════
  hygiene:
    name: 仓库卫生（凭据 / 产物 / 行尾）
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5
        with:
          # 卫生检查要看**全部历史**，默认的浅克隆只取一个提交
          fetch-depth: 0

      - name: 凭据与产物不得入库
        # ★ 这条是硬闸门。凭据一旦进了 git 历史，改密码也删不掉
        #   （历史里的对象仍可被 clone），所以只能在入口拦住。
        run: |
          set -e
          echo "── 检查是否有凭据/产物被跟踪 ──"
          # .env.example 是模板，显式放行；其余 .env* 一律不许
          bad=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$' || true)
          bad="$bad$(git ls-files | grep -E '_scan_runs/|_uploads/|node_modules/|\.venv/|__pycache__/|\.pytest_cache/' || true)"
          if [ -n "$bad" ]; then
            echo "❌ 以下文件不该入库："
            echo "$bad"
            exit 1
          fi
          echo "✅ 无凭据与产物"

      - name: 历史中不得出现凭据文件
        run: |
          set -e
          echo "── 扫描全部历史 ──"
          bad=$(git log --all --pretty=format: --name-only \
                | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$' | sort -u || true)
          if [ -n "$bad" ]; then
            echo "❌ 历史里出现过凭据文件："
            echo "$bad"
            exit 1
          fi
          echo "✅ 历史干净"

      - name: 行尾必须统一为 LF
        # 交付到 Linux 时 CRLF 会让 shell 脚本直接坏掉，
        # 而报错信息（bad interpreter）指向解释器路径，误导性很强。
        run: |
          set -e
          echo "── 检查行尾 ──"
          # `git ls-files --eol` 的 i/ 是索引里的行尾（也就是仓库里的）
          bad=$(git ls-files --eol | grep -E '^i/(crlf|mixed)' || true)
          if [ -n "$bad" ]; then
            echo "❌ 以下文件在仓库里不是纯 LF："
            echo "$bad" | head -30
            echo ""
            echo "修法：git add --renormalize . 然后提交"
            exit 1
          fi
          echo "✅ 全部为 LF"

      - name: 锁文件与声明同步
        # ★ 判据**不是**"重生成后无 diff"。
        #
        #   声明里是范围约束（`fastapi>=0.115,<1.0`），`pip-compile` 每次都
        #   解析当时最新的兼容版本 —— 上游一发新版，重跑就有 diff。拿 diff
        #   当判据，这条检查会在每次发版时无故变红，红几次就会被关掉，然后
        #   它不再拦住任何东西。
        #
        #   这里查的是真正会"装不上"的两件事：声明里的包锁文件里没有、
        #   锁定的版本不满足声明的约束。判据与上游发版无关，所以稳定。
        #   两份锁文件的运行时版本也必须是同一套（否则 CI 与生产装两套）。
        #   完整理由写在脚本头部。
        run: |
          set -e
          cd suvex-api
          python3 scripts/verify_lockfiles.py
