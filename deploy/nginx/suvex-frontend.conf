# Suvex 前端静态服务 + /api 反代 —— **Kali 部署变体**（v0.39）
#
# ## 与 `suvex-api/deploy/nginx.conf` 的关系
#
# 那份是**通用生产模板**（TLS、`suvex.example.com`、`/opt/suvex/...`）。
# 这份是**当前这台 Kali 的实际部署**，差异只有四处，都是有意的：
#
# | | 通用模板 | 本文件 | 为什么 |
# | --- | --- | --- | --- |
# | TLS | 443 + 证书 | **HTTP（8080）** | 线上还没有证书（F2），隧道层也未定 —— 见交付说明 |
# | `server_name` | `suvex.example.com` | `suvex.asia` | 实际域名 |
# | 静态根 | `/opt/suvex/suvex-web/dist` | `/root/suvex/suvex-web/dist` | 实际路径 |
# | `Host` 头 | `$host` | **`$http_host`** | ★ 见下，这一处是**必须**改的 |
#
# 其余（SSE 无缓冲、超时、`client_max_body_size`、安全头、SPA 回退）
# **逐条照抄模板** —— 那些结论都是实测得来的，不要另立一套。
#
# ## ★★ 为什么 `Host` 必须是 `$http_host` 而不是 `$host`
#
# `$host` 会被 nginx **规范化**（转小写、**去掉端口**）；`$http_host` 是
# 客户端发来的**原样**值。
#
# 而后端 `auth/deps.py` 的 `enforce_csrf` 把"本请求自己的源"算成：
#
#     own = f"{request.url.scheme}://{request.url.netloc}"
#
# 再与浏览器的 `Origin` 比对。用 `$host` 时，只要访问带**非默认端口**
# （比如 `suvex.asia:8080`），`own` 会丢掉端口而 `Origin` 带着 ——
# 两者不相等 → **所有写操作 403 `CROSS_ORIGIN_BLOCKED`**，
# 而症状看起来像"保存按钮坏了"。
#
# ⚠️ 这一行**同时**担两个责任：功能（写操作能不能过）与安全
#    （CSRF 判定基准对不对）。见 `vite.config.ts:36-57` 记的那个坑。
#
# ## ★ 刻意**不**设置 X-Forwarded-Host
#
# 后端 `_allowed_origins` **无条件信任** `X-Forwarded-Host`，而客户端
# 可以自己伪造它（不是只有反代能设）。反代不发这个头，就少一条
# "反代发的"与"客户端伪造的"混在一起的机会。
#
# `X-Forwarded-Proto` 保留（模板里也有）：后端**只在
# `X-Forwarded-Host` 存在时**才读它，所以单独发它无害。
#
# ## ★ 不启用 uvicorn 的 `--proxy-headers`
#
# 一旦 uvicorn 开始信任 `X-Forwarded-*`，`request.url` 会跟着变 ——
# 伪造面从"只有 `_allowed_origins` 一条"扩到整个 URL 派生逻辑。
# 所以 service 单元里没有这两个参数，且在这里说明为什么。

upstream suvex_api_v39 {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name suvex.asia;

    # 上传题目附件可能到 200 MB（见 `scans/uploads.py` 的 MAX_BYTES），
    # nginx 默认 1 MiB —— 不改的话大附件被 413 挡掉，
    # 而前端只说"服务端返回了非 JSON 响应"，看不出是反代拦的。
    #
    # ⚠️ v0.84 提上限时踩过的坑：这一处和 `uploads.MAX_BYTES` 是**两道**闸。
    #    只改应用层没用（请求到不了应用），只改这里也没用（应用层会在自己的
    #    上限处再拒一次）。两处必须一起改。
    #
    #    这里给 200m 而不是跟 MAX_BYTES 一模一样：multipart 的 boundary、
    #    每段的 header 都要占字节，一个正好 200 MB 的文件可能因为几百字节的
    #    协议开销被拒 —— 留的是那点余量，不是给更大的文件的。
    client_max_body_size 200m;

    # ── 安全响应头（照抄模板）──────────────────────────────
    #
    # ⚠️ 不加 HSTS：线上还是 HTTP，加了会让浏览器强制走 https 而打不开。
    #    等证书就位后再加（模板里那份有）。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # ── 前端静态产物 ────────────────────────────────────────
    #
    # ★ 这里服务的是 `npm run build` 的产物，**不是** Vite 开发服务器。
    #   加固前 5173 是 `npx vite --host 0.0.0.0`，于是公网可以拿到
    #   `/@vite/client`（210,597 字节）与 `/src/*.tsx` 的完整 TS 源码。
    #
    # ## ★★ 为什么根目录不是 `/root/suvex/suvex-web/dist`
    #
    # 那是**构建产物所在**，但 nginx worker 以 `www-data` 跑，而
    # `/root` 是 `drwx------`（700）—— worker **进不去**，所有静态请求
    # 得到 **403**（实测：`stat() ... failed (13: Permission denied)`）。
    #
    # ⚠️ 不能靠"把 /root 放宽到 755"来解决：`/root` 就该是 700，
    #    为跑一个静态站把它打开是拿系统安全换便利。
    #
    # 正解是**把产物放到 nginx 读得到的地方**，且**不能是复制** ——
    # 复制会在下次 `npm run build` 之后**静默变旧**（用户看到旧页面，
    # 而文件明明"在"）。所以用 **bind mount** 让两边自动同步：
    #
    #     mount --bind /root/suvex/suvex-web/dist /opt/suvex/suvex-web/dist
    #     # 并写进 /etc/fstab 以便重启后仍生效
    #
    # `/opt/suvex/suvex-web/dist` 也是本项目**通用模板**
    # （`suvex-api/deploy/nginx.conf`）约定的路径，与它一致。
    root /opt/suvex/suvex-web/dist;
    index index.html;

    # 带哈希的构建产物可以长期缓存（文件名变则缓存自动失效）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ★ index.html **不能**缓存：它引用那些带 hash 的文件，
    #   缓存住会让用户永远停在旧版本（发新版后白屏）。
    #   （模板里没有这一条 —— 那里靠 TLS 层的默认行为，这里显式写。）
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA 回退：任何不存在的路径交给 index.html（前端路由）。
    # 不能回 404 —— 直接访问 /scans 会打不开。（照抄模板）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ★ v0.39：**显式挡掉开发期特有的路径**，别靠 SPA 回退。
    #
    # 为什么要有这一段：加固前 5173 是 Vite 开发服务器，公网能拿到
    # `/@vite/client`（210,597 字节）与 `/src/*.tsx` 的**完整 TS 源码**。
    #
    # 切到 dist 之后，这些路径会走上面的 SPA 回退 —— 返回 **index.html
    # 且状态码 200**。那在**功能上**已经安全了（没有源码），但它有两个坏处：
    #
    #   1. 审计/扫描工具看到 200，会**报告这些路径存在**，而它们不存在；
    #   2. 下一个看日志的人分不清"这是回退"还是"真有这个资源"。
    #
    # 显式 404 把语义说准：**这个路径没有东西**。
    #
    # ## ⚠️ 第一版**漏了**项目文件（2026-10-15 复核发现，已修）
    #
    # 第一版只挡了 `@vite` / `@react-refresh` / `@fs` / `src/` /
    # `node_modules/`，于是 `/vite.config.ts`、`/package.json`、
    # `/.env` 等**仍走回退返回 200**（实测 size=3739，是 index.html）。
    #
    # 功能上仍安全，但**与上面那段意图不符**：它们同样是"看起来存在
    # 而实际不存在"。而且这些正是审计点名的项 —— 5173 上
    # `/vite.config.ts` 实测 **24,135 字节**（含完整的暴露面设计文档）。
    #
    # ## 覆盖范围（两类，按"为什么该挡"分）
    #
    # **① 开发服务器的内部路径**（dist 里根本不存在）：
    #     `@vite` / `@react-refresh` / `@fs` / `@id` / `src/` / `node_modules/`
    #
    # **② 项目文件**（构建产物里没有，但源码树里有）：
    #     `vite.config.*` / `vitest.config.*` / `package.json` /
    #     `package-lock.json` / `pnpm-lock.yaml` / `tsconfig*.json` /
    #     `.env*` / `README.md` / `Dockerfile` / `compose*.yml` /
    #     `.git*`（`.git/config` 泄露仓库地址） / `eslint.config.*` /
    #     `tailwind.config.*` / `postcss.config.*`
    #
    # ⚠️ 为什么**不能**改成"只放行 `/assets/` + `/favicon.svg`"：
    #    那会破坏 SPA 回退（前端路由 `/scans`、`/ctf2` 需要回退到
    #    index.html）。所以只能**加法** —— 逐个列出该挡的前缀/文件名。
    #
    # ⚠️ 这条**必须**与 dist 的实际内容对齐：dist 里只有
    #    `assets/`、`favicon.svg`、`index.html`。将来若构建产物多出
    #    顶层文件（比如 `robots.txt`），要确认它没被下面误伤。
    location ~ ^/(@vite|@react-refresh|@fs|@id|src/|node_modules/) {
        return 404;
    }

    # 项目文件（含点开头的配置文件）。
    # ⚠️ nginx 的 location 正则**区分大小写**（`~` 而非 `~*`）——
    #    这里刻意用区分大小写：`README.md` 是常见的，`readme.md` 不是，
    #    而多挡一个不存在的名字没有代价。
    location ~ ^/(vite\.config\.|vitest\.config\.|eslint\.config\.|tailwind\.config\.|postcss\.config\.|tsconfig.*\.json|package\.json|package-lock\.json|pnpm-lock\.yaml|yarn\.lock|Dockerfile|docker-compose|compose\.|\.env|\.git|README\.md|AGENTS\.md) {
        return 404;
    }

    # ── API ─────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://suvex_api_v39;
        proxy_http_version 1.1;

        # ★★ 原样透传（见文件头：功能与 CSRF 都靠它）
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # ── SSE（照抄模板，理由见模板文件头第 1、2 条）────────
        #
        # 少了 `proxy_buffering off`，事件流会被攒起来再发 ——
        # 表现是活动页一片空白，直到结束才一次性刷出来，
        # 而它看起来像前端问题。
        #
        # `proxy_read_timeout` 必须大于 SSE 心跳（默认 20s）：
        # 给到 3600s（SSE 是长连接，不按普通请求算）。
        proxy_buffering off;
        proxy_cache off;
        # ★ gzip 也要关：压缩同样要攒够一块才发（会破坏流式）
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── 收敛公网暴露面（v0.39，在模板基础上收紧）────────────
    #
    # 应用层已用**独立开关**关掉 docs（`SUPEX_EXPOSE_DOCS` 默认关），
    # 这里再加一道 —— 反代是最外层，也是唯一能按来源 IP 限的地方。
    #
    # ★★ `/metrics` 这里**刻意不做 IP 限制**，理由要说清楚：
    #
    # 通用模板（`suvex-api/deploy/nginx.conf`）用的是
    # `allow 127.0.0.1; allow 10.0.0.0/8; allow 172.16/12; allow 192.168/16;`
    # —— 那在"nginx 直接对外"的部署里是对的。
    #
    # 但**本部署走 frp 隧道**：frpc 在**同一台机器**上把远端流量转发到
    # `127.0.0.1:8080`。于是 nginx 看到的 `$remote_addr` **永远是
    # 127.0.0.1** —— 那条 `allow 127.0.0.1;` 会**放行所有人**，
    # 而 `deny all` 永远不生效。
    #
    # 那是"看起来有防线、实际没有"（项目最警惕的那类），比不写更糟：
    # 下一个人会以为 metrics 已经限住了。
    #
    # 所以本部署**不在这里假装限制**，而是：
    #   ① 应用层默认**关掉**暴露（`SUPEX_EXPOSE_METRICS=false`，见 `.env`）；
    #   ② 真要监控就在**隧道层**做（frp 的 `allowUsers`/独立端口），
    #      或让 Prometheus 直连 `127.0.0.1:8000`（绕过 nginx）。
    #
    # 保留这个 location 只是为了**显式挡掉**它（比依赖应用层单一防线稳），
    # 而不是靠 IP 判据。真要放开时把下面的 `return 404` 换成 proxy_pass。
    location = /api/v1/metrics {
        return 404;
    }

    # 文档端点：应用层默认已关（404），这里再挡一层防配置漂移 ——
    # 万一有人把 `SUPEX_EXPOSE_DOCS` 打开忘了关，公网仍然拿不到。
    location ~ ^/api/v1/(docs|openapi\.json)$ {
        return 404;
    }

    # ⚠️ `/api/v1/health` **不挡** —— 隧道与容器的探活要用它，
    #    而它只回 status + 版本号（不含内部信息）。
}
