<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="540" viewBox="0 0 1500 540" role="img" aria-label="Suvex — autonomous security agent">
  <defs>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5F3FF"/>
      <stop offset="0.5" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B7CF6" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#8B7CF6" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#8B7CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#94A3B8" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1500" height="540" fill="#07080B"/>
  <rect width="1500" height="540" fill="url(#grid)"/>
  <ellipse cx="750" cy="205" rx="330" ry="210" fill="url(#halo)"/>

  <!-- 四角取景框 -->
  <g fill="none" stroke="#A78BFA" stroke-opacity="0.35" stroke-width="1.5">
    <path d="M48 92V62h30M1422 92V62h-30M48 478v30h30M1422 478v30h-30"/>
  </g>

  <!-- 左右装饰：细竖线 + 折线 -->
  <g fill="none" stroke="#8B7CF6" stroke-opacity="0.28" stroke-width="1.2">
    <path d="M86 190v120M1414 190v120"/>
    <path d="M86 236l7 10-7 10 7 10-7 10M1414 236l-7 10 7 10-7 10 7 10"/>
  </g>

  <!-- 点阵标记：外圈 8 点 + 中心发光点（与 favicon 同构） -->
  <g fill="#2A3040">
    <circle cx="700" cy="96" r="8"/><circle cx="734" cy="96" r="8"/><circle cx="768" cy="96" r="8"/>
    <circle cx="700" cy="130" r="8"/><circle cx="768" cy="130" r="8"/>
    <circle cx="700" cy="164" r="8"/><circle cx="734" cy="164" r="8"/><circle cx="768" cy="164" r="8"/>
  </g>
  <circle cx="734" cy="130" r="20" fill="#8B7CF6" opacity="0.5" filter="url(#soft)"/>
  <circle cx="734" cy="130" r="11" fill="#C4B5FD"/>

  <!-- 字标 -->
  <text x="750" y="306" text-anchor="middle" fill="url(#word)"
        font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="112" font-weight="650" letter-spacing="1">Suvex</text>

  <!-- 标语 -->
  <text x="750" y="380" text-anchor="middle" fill="#CBD5E1" fill-opacity="0.62"
        font-family="ui-monospace, 'Cascadia Code', 'JetBrains Mono', monospace" font-size="19" letter-spacing="7">[ AUTONOMOUS SECURITY AGENT ]</text>

  <!-- 底部能力行 -->
  <text x="750" y="444" text-anchor="middle" fill="#94A3B8" fill-opacity="0.55"
        font-family="ui-monospace, 'Cascadia Code', 'JetBrains Mono', monospace" font-size="14" letter-spacing="4">RECON · EXPLOIT · VERIFY · REPORT</text>
</svg>
