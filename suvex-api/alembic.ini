# Alembic configuration.
#
# ⚠️ THIS FILE MUST STAY ASCII-ONLY.
#
# Alembic reads alembic.ini with `encoding="locale"` (see
# alembic/util/compat.py). On a Chinese Windows box the locale encoding is GBK,
# so a single Chinese character here crashes every alembic command with:
#     UnicodeDecodeError: 'gbk' codec can't decode byte ...
# The same happens on Western Windows (cp1252) with any non-ASCII byte.
# That is not a theoretical hazard - it broke this project's first migration run.
#
# The reasoning behind each setting lives in alembic/README.md (UTF-8, read by
# humans and editors, never by configparser).
#
# ⚠️ `sqlalchemy.url` is deliberately empty.
# Writing it here would put the database password in a second place that is
# committed to git, and that copy would never be updated - showing up as
# "changed .env but migrations still hit the old database".
# env.py reads it from `app.core.config.Settings`; override per-run with
#     alembic -x db_url=postgresql+psycopg://user:pass@host:port/db upgrade head

[alembic]
script_location = alembic
prepend_sys_path = .
# Without this, alembic splits prepend_sys_path on spaces/commas/colons
# (legacy behaviour) and emits a DeprecationWarning on every run.
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
version_path_separator = os
timezone = UTC

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
