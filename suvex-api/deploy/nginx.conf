# Suvex 反向代理配置（nginx）。
#
# 放在 `/etc/nginx/conf.d/suvex.conf`，或 sites-available + 软链。
#
# ## 它解决什么
#
# `suvex-api` 只监听 `127.0.0.1:8000`（见 `deploy/suvex-api.service`）。
# 这个配置把外部请求转进去，并处理三件后端不该管的事：
# TLS、静态产物、以及 SSE 的缓冲。
#
# ## ⚠️ 三处**必须**注意的地方（都踩过）
#
# ### 1. SSE 的 `proxy_buffering off`
#
# 少了它，nginx 会把事件流**攒起来**再发 —— 表现是活动页一片空白，
# 直到扫描结束才一次性刷出来。而它看起来像前端问题。
#
# 后端已经发了 `X-Accel-Buffering: no`（nginx 认这个头），
# 但这里仍然显式写一遍：那个头依赖 nginx 的版本与配置，而
# `proxy_buffering off` 是确定的。
#
# ### 2. `proxy_read_timeout` 必须大于 SSE 心跳间隔
#
# 心跳默认 20 秒（`SUPEX_SSE_HEARTBEAT_SECONDS`）。nginx 默认的
# `proxy_read_timeout` 是 **60 秒** —— 够用，但如果把心跳调大到
# 超过它，连接会被 nginx 掐断，前端会看到"反复重连"。
# 所以这里给到 3600 秒（SSE 是长连接，不该按普通请求的超时算）。
#
# ### 3. 来源 IP：`X-Forwarded-For` 与 `X-Real-IP`
#
# 后端**默认不读** `X-Forwarded-For`（见 `app/auth/deps.py`）——
# 因为它可被客户端伪造，而它同时用于**登录限流**与**授权留痕**。
#
# 信任它的前提是：**反代必须自己覆盖这个头**（下面的
# `proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;`
# 会把自己看到的那一段追加进去），并且后端启动时带了
# `--forwarded-allow-ips=127.0.0.1`（只信任本机反代）。
#
# ⚠️ 如果 nginx 不在同一台机器上，`--forwarded-allow-ips` 要改成
#    那台机器的地址 —— 而不是 `0.0.0.0/0`（那等于信任任何人）。

upstream suvex_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name suvex.example.com;

    # 把 HTTP 全部赶到 HTTPS。指标与健康检查也走 HTTPS ——
    # 没有理由给它们开一个明文例外。
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name suvex.example.com;

    ssl_certificate     /etc/nginx/certs/suvex.crt;
    ssl_certificate_key /etc/nginx/certs/suvex.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 上传题目附件可能到 50 MiB（见 `scans/uploads.py` 的 MAX_BYTES），
    # 而 nginx 默认上限是 1 MiB —— 不改的话大附件会被 413 挡掉，
    # 而前端的错误提示是"上传失败"，看不出是反代拦的。
    client_max_body_size 64m;

    # ── 安全响应头 ──────────────────────────────────────────
    #
    # ⚠️ **不加 HSTS 的 `includeSubDomains`**：那会要求整个域下
    #    所有子域都上 HTTPS，而你可能还有别的服务在跑。
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    # 这个应用会渲染用户上传的内容（附件、证据片段），
    # 而它不该被嵌进任何别的站点
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # ── 前端静态产物 ────────────────────────────────────────
    #
    # `npm run build` 的产物。前端是**同源**部署的（与后端共用
    # 这一个 server 块），所以不需要 CORS —— 而这也正是
    # `vite.config.ts` 里那套代理设计的生产对应物。
    root /opt/suvex/suvex-web/dist;
    index index.html;

    # 带哈希的构建产物可以长期缓存
    location /assets/ {
        # ⚠️ **必须保留这一行**，否则本文件上方那四条安全头会在
        #    `/assets/` 下**整段失效**：nginx 的 `add_header` **不继承**
        #    —— 本层只要出现一条 `add_header`，上层（server 级）的就全部被
        #    取代，而不是叠加。实测过：`/assets/index-*.css` 返回
        #    `Cache-Control: public, immutable`，而 nosniff / DENY /
        #    Referrer-Policy 三条一个都没有；同一站点走 `location /` 的
        #    `/favicon.svg` 三条都在 —— 这就证明丢失只发生在有 `add_header`
        #    的这一层。
        #    `add_header_inherit merge` 让本层的头与上层**合并**输出。
        # ⛔ **需要 nginx ≥ 1.29.3**。低版本不认这个指令，会以
        #    `unknown directive` **直接启动失败**（不是降级、不是忽略）。
        #    部署前用 `nginx -v` 确认版本；若目标机确实低于 1.29.3，
        #    删掉这一行，并改为把上方四条安全头在本块内**逐条重写一遍**。
        add_header_inherit merge;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ⚠️ SPA 回退：任何不存在的路径都交给 index.html（前端路由）。
    #    不能回 404 —— 直接访问 /scans 会打不开。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API ─────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://suvex_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # ── SSE（见文件头第 1、2 条）──────────────────────
        #
        # 这几项对**所有** /api/ 请求生效，而不只是 SSE ——
        # 因为判断"这个响应是不是事件流"要在 nginx 层做
        # （`map` 匹配 content-type），而那是额外的复杂度，
        # 收益只是让普通请求的缓冲开回来（省一点内存）。
        #
        # 代价：普通 JSON 响应也走无缓冲转发。对本平台的请求量
        # （单机自托管、一个人用）这完全不构成问题。
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── 指标 ────────────────────────────────────────────────
    #
    # ★ 默认**只允许本机与内网监控网段**访问。
    #
    # 后端把 `/metrics` 做成 public 的（Prometheus 没有我们的凭据），
    # 所以"谁能看到它"这件事必须在反代这层决定。
    #
    # 不想暴露的话，把下面整段注释掉即可 —— 指标本身仍在后端可用
    # （`curl 127.0.0.1:8000/api/v1/metrics`），只是外部拿不到。
    location = /api/v1/metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass http://suvex_api;
        proxy_set_header Host $host;
    }
}
